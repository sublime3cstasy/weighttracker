<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleekWeight - Cutting & Progress Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-xl">
                    ⚖️
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">SleekWeight</h1>
                    <p class="text-xs text-gray-400">Cutting & Progress Analytics</p>
                </div>
            </div>
            <button onclick="openLogModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 flex items-center space-x-2">
                <span>+ Log Weight</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass-card p-5 rounded-2xl">
                <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">Current Weight</p>
                <div class="flex items-baseline space-x-2 mt-2">
                    <span id="currentWeightDisplay" class="text-3xl font-bold text-white">70.1 kg</span>
                    <span id="weightDiffBadge" class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">--</span>
                </div>
                <p id="currentDateDisplay" class="text-xs text-gray-500 mt-2">Latest entry</p>
            </div>

            <div class="glass-card p-5 rounded-2xl">
                <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">7-Day Trend (Avg)</p>
                <div class="flex items-baseline space-x-2 mt-2">
                    <span id="weeklyAvgDisplay" class="text-3xl font-bold text-white">-- kg</span>
                </div>
                <p class="text-xs text-gray-500 mt-2">Smoothed daily noise</p>
            </div>

            <div class="glass-card p-5 rounded-2xl">
                <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">Total Cut Progress</p>
                <div class="flex items-baseline space-x-2 mt-2">
                    <span id="totalChangeDisplay" class="text-3xl font-bold text-indigo-400">-- kg</span>
                </div>
                <p class="text-xs text-gray-500 mt-2">Since early October (~76kg start)</p>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-card p-6 rounded-2xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-semibold text-white text-base">Weight Trajectory</h2>
                <span class="text-xs text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-lg border border-indigo-500/20">Target: 70.0 kg</span>
            </div>
            <div class="relative h-72 w-full">
                <canvas id="weightChart"></canvas>
            </div>
        </div>

        <!-- Quick Action & Logs Table -->
        <div class="glass-card rounded-2xl overflow-hidden">
            <div class="p-5 border-b border-gray-800 flex justify-between items-center">
                <h2 class="font-semibold text-white text-base">History Log</h2>
                <button onclick="resetToDefaultData()" class="text-xs text-gray-400 hover:text-gray-200 underline">Reset default entries</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs text-gray-400 bg-gray-900/40">
                            <th class="py-3 px-5">Date</th>
                            <th class="py-3 px-5">Weight (kg)</th>
                            <th class="py-3 px-5">Change</th>
                            <th class="py-3 px-5 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-gray-800/50 text-sm">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal for Logging -->
    <div id="logModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-white text-lg">Log Daily Weight</h3>
                <button onclick="closeLogModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>
            <form id="weightForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Date</label>
                    <input type="date" id="logDate" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Weight (kg)</label>
                    <input type="number" step="0.1" id="logWeight" placeholder="70.1" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                
                <!-- Quick Offset Buttons -->
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5">Quick Adjust Last Weight</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="adjustQuick(-0.5)" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded-lg text-gray-300">-0.5</button>
                        <button type="button" onclick="adjustQuick(-0.2)" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded-lg text-gray-300">-0.2</button>
                        <button type="button" onclick="adjustQuick(0.2)" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded-lg text-gray-300">+0.2</button>
                        <button type="button" onclick="adjustQuick(0.5)" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded-lg text-gray-300">+0.5</button>
                    </div>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeLogModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2.5 rounded-xl text-sm transition">Cancel</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const defaultEntries = [
            { date: '2026-09-01', weight: 76.2 },
            { date: '2026-09-10', weight: 75.8 },
            { date: '2026-09-20', weight: 75.5 },
            { date: '2026-10-01', weight: 75.0 },
            { date: '2026-10-05', weight: 74.3 },
            { date: '2026-10-10', weight: 73.6 },
            { date: '2026-10-15', weight: 72.8 },
            { date: '2026-10-20', weight: 72.1 },
            { date: '2026-10-25', weight: 71.5 },
            { date: '2026-10-30', weight: 70.8 },
            { date: '2026-11-05', weight: 70.3 },
            { date: '2026-11-08', weight: 70.1 }
        ];

        let entries = JSON.parse(localStorage.getItem('sleekweight_entries'));
        if (!entries || entries.length === 0) {
            entries = defaultEntries;
        }
        let weightChart = null;

        function saveToStorage() {
            localStorage.setItem('sleekweight_entries', JSON.stringify(entries));
        }

        function sortEntries() {
            entries.sort((a, b) => new Date(a.date) - new Date(b.date));
        }

        function initApp() {
            sortEntries();
            renderDashboard();
            initChart();
        }

        function renderDashboard() {
            if (entries.length === 0) return;

            const latest = entries[entries.length - 1];
            
            // Current weight & Date
            document.getElementById('currentWeightDisplay').innerText = latest.weight.toFixed(1) + ' kg';
            document.getElementById('currentDateDisplay').innerText = 'Recorded on ' + latest.date;

            // 7-day trend average
            const last7 = entries.slice(-7);
            const avg7 = last7.reduce((acc, curr) => acc + curr.weight, 0) / last7.length;
            document.getElementById('weeklyAvgDisplay').innerText = avg7.toFixed(1) + ' kg';

            // Total change from start
            const totalDiff = latest.weight - entries[0].weight;
            const diffElem = document.getElementById('totalChangeDisplay');
            diffElem.innerText = (totalDiff > 0 ? '+' : '') + totalDiff.toFixed(1) + ' kg';

            // Diff badge compared to previous entry
            if (entries.length > 1) {
                const prev = entries[entries.length - 2];
                const diff = latest.weight - prev.weight;
                const badge = document.getElementById('weightDiffBadge');
                badge.innerText = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg vs last';
                badge.className = `text-xs font-semibold px-2 py-0.5 rounded-full ${diff <= 0 ? 'text-emerald-400 bg-emerald-500/10' : 'text-rose-400 bg-rose-500/10'}`;
            }

            // Render table
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            
            [...entries].reverse().forEach((entry, index) => {
                const actualIdx = entries.length - 1 - index;
                const prevEntry = actualIdx > 0 ? entries[actualIdx - 1] : null;
                const diff = prevEntry ? (entry.weight - prevEntry.weight).toFixed(1) : '--';
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800/30 transition';
                tr.innerHTML = `
                    <td class="py-3 px-5 text-gray-300 font-medium">${entry.date}</td>
                    <td class="py-3 px-5 text-white font-bold">${entry.weight.toFixed(1)} kg</td>
                    <td class="py-3 px-5 text-xs ${diff < 0 ? 'text-emerald-400' : diff > 0 ? 'text-rose-400' : 'text-gray-500'}">${diff !== '--' ? (diff <= 0 ? diff + ' kg' : '+' + diff + ' kg') : '--'}</td>
                    <td class="py-3 px-5 text-right">
                        <button onclick="deleteEntry(${actualIdx})" class="text-gray-500 hover:text-rose-400 text-xs px-2 py-1 transition">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (weightChart) {
                weightChart.data.labels = entries.map(e => e.date);
                weightChart.data.datasets[0].data = entries.map(e => e.weight);
                weightChart.update();
            }
        }

        function initChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            weightChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: entries.map(e => e.date),
                    datasets: [{
                        label: 'Weight (kg)',
                        data: entries.map(e => e.weight),
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#6366f1',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#9ca3af', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: '#9ca3af', font: { size: 11 } }
                        }
                    }
                }
            });
        }

        function openLogModal() {
            document.getElementById('logModal').classList.remove('hidden');
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('logDate').value = today;
            if (entries.length > 0) {
                document.getElementById('logWeight').value = entries[entries.length - 1].weight;
            }
        }

        function closeLogModal() {
            document.getElementById('logModal').classList.add('hidden');
        }

        function adjustQuick(amount) {
            const input = document.getElementById('logWeight');
            let current = parseFloat(input.value) || (entries.length > 0 ? entries[entries.length - 1].weight : 70.1);
            input.value = (current + amount).toFixed(1);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const date = document.getElementById('logDate').value;
            const weight = parseFloat(document.getElementById('logWeight').value);

            const existingIndex = entries.findIndex(e => e.date === date);
            if (existingIndex >= 0) {
                entries[existingIndex].weight = weight;
            } else {
                entries.push({ date, weight });
            }

            saveToStorage();
            sortEntries();
            renderDashboard();
            closeLogModal();
        }

        function deleteEntry(index) {
            if (confirm('Delete this entry?')) {
                entries.splice(index, 1);
                saveToStorage();
                renderDashboard();
            }
        }

        function resetToDefaultData() {
            if (confirm('Reset to your recorded cutting history starting from late summer?')) {
                entries = [...defaultEntries];
                saveToStorage();
                renderDashboard();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
